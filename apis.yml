aid: freshop
name: Freshop
description: >-
  Freshop is an eCommerce platform purpose-built for grocery and specialty
  retail, now part of NCR Voyix. It powers branded online storefronts, mobile
  shopping, order fulfillment, pickup, and delivery for independent and
  regional grocers, and integrates third-party services for loyalty, coupons,
  email, SMS, and fulfillment. Freshop exposes a live REST API at
  api.freshop.com that serves store and product data to Freshop-powered
  storefronts and apps, authenticated with an application key (app_key)
  query-string parameter and versioned by a numeric path segment.
